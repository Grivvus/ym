apiVersion: apps/v1
kind: Deployment
metadata:
  name: ym-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ym
  template:
    metadata:
      labels:
        app: ym
        log-collect: "true"
    spec:
      containers:
        - name: ym
          image: ym:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ym-secret
            - configMapRef:
                name: ym-config
          readinessProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
