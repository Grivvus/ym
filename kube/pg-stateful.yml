apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ym-pg
spec:
  serviceName: pg-headless
  replicas: 1
  selector:
    matchLabels:
      app: ym-pg
  template:
    metadata:
      labels:
        app: ym-pg
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ym-pg
          image: postgres:17
          envFrom:
            - secretRef:
                name: ym-secret
          ports:
          - containerPort: 5432
            name: ym-pg
          volumeMounts:
          - name: db
            mountPath: /var/lib/postgresql/data

        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.20.1
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://postgres:hackme@localhost:5432/postgres?sslmode=disable"
          ports:
            - containerPort: 9187
              name: pg-exp

  volumeClaimTemplates:
    - metadata:
        name: db
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
