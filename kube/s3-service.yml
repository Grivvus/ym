apiVersion: v1
kind: Service
metadata:
  name: storage-nodeport
spec:
  type: NodePort
  selector:
    app: ym-storage
  ports:
    - protocol: TCP
      name: nodeport-api
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - protocol: TCP
      name: nodeport-console
      port: 9001
      targetPort: 9001
      nodePort: 30901
